name: NextPlayer Latest Release APK

on:
  push:
    paths:
      - 'nextplayer-latest/**'
      - '.github/workflows/nextplayer_latest_release.yaml'
  pull_request:
    paths:
      - 'nextplayer-latest/**'
      - '.github/workflows/nextplayer_latest_release.yaml'
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build universal release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextplayer-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Build optimized release with repository debug signing key
        run: |
          set -o pipefail
          ./gradlew assembleRelease-with-debug-signing 2>&1 | tee /tmp/nextplayer-release.log || {
            message=$(grep -Ei '(^e:|error|failed|what went wrong|cause|exception)' /tmp/nextplayer-release.log | tail -n 20 | tr '\n' '|')
            echo "::error::$message"
            exit 1
          }

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -name 'app-universal-*.apk' -print -quit)
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          badging=$("$build_tools/aapt" dump badging "$apk")
          echo "$badging" | head -n 5
          echo "$badging" | grep -q "package: name='dev.anilbeesetti.nextplayer.latest.release'"
          if echo "$badging" | grep -q '^application-debuggable'; then
            echo '::error::Release APK is unexpectedly debuggable'
            exit 1
          fi
          mkdir -p release-artifact
          cp "$apk" release-artifact/NextPlayer-latest-universal.apk

      - name: Upload universal release APK
        uses: actions/upload-artifact@v7
        with:
          name: NextPlayer-latest-universal-release
          path: nextplayer-latest/release-artifact/NextPlayer-latest-universal.apk
          if-no-files-found: error
