name: Publish NextPlayer Latest APK

on:
  push:
    branches: [arena/c0beb314-nextplayer]
    paths:
      - '.github/workflows/publish_nextplayer_latest_once.yaml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified universal APK
    runs-on: ubuntu-latest
    steps:
      - name: Download previously built release APK
        uses: actions/download-artifact@v7
        with:
          artifact-ids: 12965751511
          github-token: ${{ github.token }}
          run-id: 41029738778
          path: release-apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s release-apk/NextPlayer-latest-universal.apk
          gh release create v0.19.0-latest release-apk/NextPlayer-latest-universal.apk \
            --target efd889d279e718bfd7285d12806c6c26e86ad2e9 \
            --title 'NextPlayer Latest 0.19.0' \
            --notes 'Universal release APK with the fork playback features. Installs separately from the older fork and the latest debug build. This APK is signed with the publicly available repository debug signing key; it is not signed with a private production key.'
