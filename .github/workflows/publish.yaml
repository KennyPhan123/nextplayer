name: Publish Android App

on:
  push:
    branches:
      - 'release/v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get updated version name and version code
        run: |
          # Extract version name from branch (removing 'bump/v' prefix)
          version_name=${GITHUB_REF#refs/heads/release/v}

          # Store values as environment variables
          echo "VERSION_NAME=$version_name" >> $GITHUB_ENV

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Build app
        run: ./gradlew assembleReleaseWithDebugSigning

      - name: Rename Files
        run: |
          find app/build/outputs/apk -name "*arm64-v8a*.apk" -exec mv {} app/build/outputs/apk/nextplayer-v${{ env.VERSION_NAME }}-arm64-v8a.apk \;
          find app/build/outputs/apk -name "*armeabi-v7a*.apk" -exec mv {} app/build/outputs/apk/nextplayer-v${{ env.VERSION_NAME }}-armeabi-v7a.apk \;
          find app/build/outputs/apk -name "*universal*.apk" -exec mv {} app/build/outputs/apk/nextplayer-v${{ env.VERSION_NAME }}-universal.apk \;
          find app/build/outputs/apk -name "*x86-*.apk" -exec mv {} app/build/outputs/apk/nextplayer-v${{ env.VERSION_NAME }}-x86.apk \;
          find app/build/outputs/apk -name "*x86_64*.apk" -exec mv {} app/build/outputs/apk/nextplayer-v${{ env.VERSION_NAME }}-x86_64.apk \;

      - name: Create Draft Release
        id: create_draft_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: app/build/outputs/apk/nextplayer-v*.apk
          draft: true
          name: v${{ env.VERSION_NAME }}
          generate_release_notes: true
          tag_name: v${{ env.VERSION_NAME }}
