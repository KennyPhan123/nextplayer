name: NextPlayer Latest Build

on:
  push:
    paths:
      - 'nextplayer-latest/**'
      - '.github/workflows/nextplayer_latest_build.yaml'
  pull_request:
    paths:
      - 'nextplayer-latest/**'
      - '.github/workflows/nextplayer_latest_build.yaml'
  workflow_dispatch:

concurrency:
  group: build-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NextPlayer Latest APK and run checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextplayer-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          gradle-home-cache-cleanup: true

      - name: Lint Checks
        run: ./gradlew ktlintCheck

      - name: Build Release-with-Debug-Signing APK
        run: ./gradlew assembleRelease-with-debug-signing

      - name: Run Local Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload artifact nextplayer-latest-universal-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-latest-universal-release.apk
          path: nextplayer-latest/app/build/outputs/apk/*/app-universal-*.apk

      - name: Upload artifact nextplayer-latest-arm64-v8a-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-latest-arm64-v8a-release.apk
          path: nextplayer-latest/app/build/outputs/apk/*/app-arm64-v8a-*.apk

      - name: Upload artifact nextplayer-latest-armeabi-v7a-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-latest-armeabi-v7a-release.apk
          path: nextplayer-latest/app/build/outputs/apk/*/app-armeabi-v7a-*.apk

      - name: Upload artifact nextplayer-latest-x86_64-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-latest-x86_64-release.apk
          path: nextplayer-latest/app/build/outputs/apk/*/app-x86_64-*.apk

      - name: Upload artifact nextplayer-latest-x86-release.apk
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-latest-x86-release.apk
          path: nextplayer-latest/app/build/outputs/apk/*/app-x86-*.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextplayer-latest-build-reports
          path: nextplayer-latest/app/build/reports
